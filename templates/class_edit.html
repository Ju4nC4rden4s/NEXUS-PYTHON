{% extends 'base.html' %}
{% load static %}

{% block title %}
Editar Clase
{% endblock %}

{% block page_css %}
<link rel="stylesheet" href="{% static 'css/classes.css' %}">
{% endblock %}

{% block content %}

<div class="topbar">
    <div>
        <h1>Editar Clase</h1>
        <p>Modificar información de {{ clase.name }}</p>
    </div>

    <a href="{% url 'classes' %}" class="btn-outline">
        Volver
    </a>
</div>

<div class="form-card">

    <form method="post">
        {% csrf_token %}

        <div class="form-row">

            <div class="form-group">
                <label>Nombre</label>

                <input
                    type="text"
                    name="name"
                    value="{{ clase.name }}"
                    required>
            </div>

            <div class="form-group">
                <label>Duración (minutos)</label>

                <input
                    type="number"
                    name="duration_minutes"
                    value="{{ clase.duration_minutes }}"
                    required>
            </div>

        </div>

        <div class="form-row">

            <div class="form-group">

                <label>Nivel</label>

                <select name="level">

                    <option value="BEGINNER"
                        {% if clase.level == 'BEGINNER' %}selected{% endif %}>
                        Principiante
                    </option>

                    <option value="INTERMEDIATE"
                        {% if clase.level == 'INTERMEDIATE' %}selected{% endif %}>
                        Intermedio
                    </option>

                    <option value="ADVANCED"
                        {% if clase.level == 'ADVANCED' %}selected{% endif %}>
                        Avanzado
                    </option>

                </select>

            </div>

        </div>

        <div class="form-group">

            <label>Descripción</label>

            <textarea
                name="description"
                rows="3">{{ clase.description }}</textarea>

        </div>

        <div class="form-actions">

            <a href="{% url 'classes' %}" class="btn-outline">
                Cancelar
            </a>

            <button type="submit" class="btn-red">
                Guardar cambios
            </button>

        </div>

    </form>

</div>

{% endblock %}
